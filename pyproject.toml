[project]
name = "argsense"
version = "2.0.0a0"
description = "New command line interface based on Rich library."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "neoprint>=0.1.13a3",
    "rich>=14.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.29.0"]

[dependency-groups]
dev = [
    # "cairosvg>=2.9.1; python_version >= '3.12'",
    "click>=8.5.0; python_version >= '3.12'",
    "clize>=5.0.1",
    "cyclopts>=5.2.0; python_version >= '3.12'",
    "defopt>=7.0.0",
    "docopt>=0.6.2",
    "faker>=40.43.0; python_version >= '3.12'",
    "fire>=0.7.1",
    # "streamlit>=1.65.0; python_version >= '3.12'",
    "streamlit-canary>=0.4.0a69; python_version >= '3.11'",
    "textual>=8.2.8",
    # "textual-web>=0.8.0; python_version >= '3.14'",
    "typer>=0.27.3; python_version >= '3.12'",
]

[project.optional-dependencies]
all = [
    "streamlit-canary>=0.4.0a69; python_version >= '3.11'",
    "textual>=8.2.8",
]
gui = ["streamlit-canary>=0.4.0a69; python_version >= '3.11'"]
tui = ["textual>=8.2.8"]

# [project.scripts]
# argsense = "argsense.__main__:cli"
# argsense-cli = "argsense.__main__:cli"
# argsense-gui = "argsense.__main__:gui"
# argsense-tui = "argsense.__main__:tui"

[project.urls]
homepage = "https://github.com/likianta/argsense-cli"

[tool.hatch.build.targets.wheel]
packages = ["argsense"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ty.rules]
invalid-type-form = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2131/"
explicit = true

[tool.uv.sources]
neoprint = { index = "likianta" }
streamlit-canary = { index = "likianta" }
