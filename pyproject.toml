[project]
name = "argsense"
version = "1.3.0b0"
description = "New command line interface based on Rich library."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "neoprint>=0.1.12",
    "rich>=14.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.29.0"]

[dependency-groups]
dev = [
    "faker>=40.43.0; python_version >= '3.10'",
    # "streamlit>=1.64.0; python_version >= '3.12'",
    # "streamlit-canary>=0.4.0a56; python_version >= '3.12'",
]

# [project.optional-dependencies]
# TODO: GUI

[project.scripts]
argsense = "argsense.__main__:cli"
argsense-cli = "argsense.__main__:cli"
argsense-gui = "argsense.__main__:gui"
argsense-tui = "argsense.__main__:tui"

[project.urls]
homepage = "https://github.com/likianta/argsense-cli"

[tool.hatch.build.targets.wheel]
packages = ["argsense"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2131/"
explicit = true

[tool.uv.sources]
neoprint = { index = "likianta" }
streamlit-canary = { index = "likianta" }
