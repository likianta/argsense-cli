[project]
name = "argsense"
version = "1.1.2"
description = "New command line interface based on Rich library."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "neoprint>=0.1.4",
    "rich>=14.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.29.0"]

[dependency-groups]
dev = [
    # "lk-utils>=3.6.0b21",
    # "pyapp-window>=2.2.3a0",
    "streamlit>=1.58.0; python_version >= '3.12'",
    # "streamlit-canary>=0.3.0b4; python_version >= '3.12'",
]

# [project.optional-dependencies]
# TODO: GUI

[project.scripts]
argsense = "argsense.__main__:cli"
argsense-cli = "argsense.__main__:cli"
argsense-gui = "argsense.__main__:gui"
argsense-tui = "argsense.__main__:tui"

[project.urls]
homepage = "https://github.com/likianta/argsense-cli"

[tool.hatch.build.targets.wheel]
packages = ["argsense"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

# [tool.ty.rules]
# invalid-type-form = "ignore"
# unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2191/"
# explicit = true

[tool.uv.sources]
lk-utils = { index = "likianta" }
neoprint = { index = "likianta" }
pyapp-window = { index = "likianta" }
streamlit-canary = { index = "likianta" }
